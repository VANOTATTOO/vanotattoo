<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANOTATTOO</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('bg.jpg') center/cover no-repeat;
    filter: brightness(0.3);
    z-index: -1;
}

.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.hero h1 {
    font-size: clamp(36px, 8vw, 90px);
    letter-spacing: 6px;
}

.hero p {
    margin-top: 10px;
    opacity: 0.7;
}

.portfolio {
    padding: 60px 20px;
    text-align: center;
}

.portfolio h2 {
    margin-bottom: 30px;
    font-size: 28px;
    letter-spacing: 3px;
}

.slider {
    display: flex;
    overflow-x: auto;
    gap: 20px;
    scroll-snap-type: x mandatory;
    padding-bottom: 20px;
}

.slider img {
    height: 300px;
    border-radius: 10px;
    scroll-snap-align: center;
    transition: 0.3s;
}

.slider img:hover {
    transform: scale(1.05);
}

.slider::-webkit-scrollbar {
    height: 6px;
}

.slider::-webkit-scrollbar-thumb {
    background: #444;
}

.contact {
    padding: 60px 20px;
    text-align: center;
}

.contact a {
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    opacity: 0.8;
}
</style>
</head>

<body>

<section class="hero">
    <h1>VANOTATTOO</h1>
    <p>Black & Grey • Custom Tattoo</p>
</section>

  <section class="hero">

        <img src="tattoo3.jpg">
        <img src="tattoo4.jpg">
        <img src="tattoo5.jpg">

    </div>
</section>
