<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANOTATTOO</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0b0b;
    color: #fff;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("images/bg.jpg") center/cover no-repeat;
    opacity: 0.25;
    z-index: -1;
}

header {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 8px;
}

.section {
    padding: 80px 20px;
    text-align: center;
}

.section h2 {
    font-size: 32px;
    margin-bottom: 20px;
}

.carousel {
    width: 100%;
    overflow: hidden;
    position: relative;
}

.carousel-track {
    display: flex;
    animation: scroll 20s linear infinite;
}

.carousel img {
    width: 300px;
    height: 400px;
    object-fit: cover;
    margin: 0 10px;
    border-radius: 10px;
}

@keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.contact {
    font-size: 20px;
    margin-top: 20px;
}

.btn {
    margin-top: 30px;
    display: inline-block;
    padding: 15px 30px;
    border: 1px solid #fff;
    text-decoration: none;
    color: #fff;
    transition: 0.3s;
}

.btn:hover {
    background: #fff;
    color: #000;
}
</style>

</head>

<body>

<header>
    <div class="logo">VANOTATTOO</div>
</header>

<section class="section">
    <h2>ОБО МНЕ</h2>
    <p>
        Я тату мастер с опытом более 4 лет. Работаю в стилях blackwork,
        sketch, realism. Создаю уникальные проекты под каждого клиента.
    </p>
</section>

<section class="section">
    <h2>ПОРТФОЛИО</h2>

    <div class="carousel">
        <div class="carousel-track">
            <img src="images/1.jpg">
            <img src="images/2.jpg">
            <img src="images/3.jpg">
            <img src="images/4.jpg">
            <img src="images/5.jpg">
            <img src="images/6.jpg">

            <img src="images/1.jpg">
            <img src="images/2.jpg">
            <img src="images/3.jpg">
            <img src="images/4.jpg">
            <img src="images/5.jpg">
            <img src="images/6.jpg">
        </div>
    </div>

</section>

<section class="section">
    <h2>ЗАПИСЬ</h2>

    <div class="contact">
        📞 +380 93 473 47 25
    </div>

    <a href="https://t.me/" class="btn">НАПИСАТЬ</a>
</section>

</body>
</html>
